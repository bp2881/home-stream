# home-stream Nginx site config
# Drop this into /etc/nginx/conf.d/flask.conf
# Also add "include conf.d/*.conf;" inside the http{} block in /etc/nginx/nginx.conf

upstream gunicorn_app {
    server 127.0.0.1:5000;
    keepalive 8;
}

server {
    listen 80;
    server_name bp2881.duckdns.org;

    # ── Static assets: served directly by Nginx (CSS, JS, images) ─────────
    location /static/ {
        alias /home/pranav/home-stream/static/;
        sendfile on;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Video streaming: proxy to Flask, which replies X-Accel-Redirect ───
    location /stream/ {
        proxy_pass         http://gunicorn_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        # Must be OFF so Nginx can process X-Accel-Redirect from Flask
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── Internal file serving (used by X-Accel-Redirect from Flask) ───────
    # Flask responds with:  X-Accel-Redirect: /media-internal/<rel_path>
    # Nginx then serves the file directly from disk (kernel sendfile).
    location /media-internal/ {
        internal;
        # This alias maps /media-internal/ → project root
        # So /media-internal/media/foo.mp4 → /home/.../home-stream/media/foo.mp4
        #    /media-internal/cache/converted/abc.mp4 → .../cache/converted/abc.mp4
        alias /home/pranav/home-stream/;

        sendfile           on;
        sendfile_max_chunk 2m;
        aio                threads;
        directio           4m;
        tcp_nopush         on;
        tcp_nodelay        on;
        output_buffers     2 512k;
    }

    # ── Thumbnails: served directly by Nginx ──────────────────────────────
    location /thumb/ {
        proxy_pass         http://gunicorn_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_buffering    on;
        expires            1d;
    }

    # ── Everything else: proxy to Gunicorn ────────────────────────────────
    location / {
        proxy_pass         http://gunicorn_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
